name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'fe/**'
      - 'landingPage/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-admin-fe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'fe/package-lock.json'

      - name: Install dependencies (FE)
        working-directory: ./fe
        run: npm ci || npm install

      - name: Build (FE)
        working-directory: ./fe
        run: npm run build

      - name: Deploy Admin FE to Cloudflare
        working-directory: ./fe
        run: npx --yes wrangler@4.114.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-landing-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'landingPage/package-lock.json'

      - name: Install dependencies (Landing Page)
        working-directory: ./landingPage
        run: npm ci || npm install

      - name: Build (Landing Page)
        working-directory: ./landingPage
        run: npm run build

      - name: Deploy Landing Page to Cloudflare
        working-directory: ./landingPage
        run: npx --yes wrangler@4.114.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
